<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Props trading desk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='6' width='8' height='4' rx='2' fill='%2369b4ff'/><rect x='9' y='6' width='6' height='4' rx='2' fill='%23efb25b'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Props trading desk</h1>
      <div class="snapshot" id="snapshot"></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="controls">
      <span class="ctl" title="Vig added back to the books' no-vig price, for every game without its own vig">Default vig
        <span id="default-vig"></span>
      </span>
      <button class="btn sim-toggle" id="sim" aria-pressed="false">Simulated bets</button>
      <button class="btn quiet" id="clear-bets">Clear bets</button>
    </div>
  </header>

  <nav class="filters" aria-label="Filters">
    <div class="seg" id="sport-filter" role="group" aria-label="Sport"></div>
    <div class="seg" id="view-filter" role="group" aria-label="Show">
      <button data-view="all" aria-pressed="true">All props</button>
      <button data-view="live" aria-pressed="false">Live only</button>
      <button data-view="alerts" aria-pressed="false">Needs attention</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Find a player" aria-label="Find a player">
  </nav>

  <div class="layout">
    <main class="games" id="games"></main>
    <aside class="rail" aria-label="Activity">
      <div class="rail-tabs" role="tablist">
        <button role="tab" data-rail="alerts" aria-selected="true">Needs attention<span class="n" id="n-alerts"></span></button>
        <button role="tab" data-rail="bets" aria-selected="false">Bet feed</button>
        <button role="tab" data-rail="log" aria-selected="false">Changes</button>
      </div>
      <div class="rail-list" id="rail"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
